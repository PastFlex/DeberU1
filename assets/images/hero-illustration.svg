<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" fill="none" role="img" aria-label="Diagrama visual de energías renovables, redes inteligentes, almacenamiento y transición ecológica">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f261e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#09141f" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="420" rx="18" fill="url(#heroBg)" stroke="#1e3a34" stroke-width="1.5" />
  
  <!-- Cuadrícula de fondo -->
  <g opacity="0.2" stroke="#34d399" stroke-width="1">
    <line x1="40" y1="60" x2="560" y2="60" />
    <line x1="40" y1="150" x2="560" y2="150" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="330" x2="560" y2="330" />
    <line x1="120" y1="40" x2="120" y2="380" />
    <line x1="260" y1="40" x2="260" y2="380" />
    <line x1="400" y1="40" x2="400" y2="380" />
    <line x1="500" y1="40" x2="500" y2="380" />
  </g>

  <!-- Conexiones principales de red energética -->
  <path d="M140 210 L260 120 L440 160 L390 300 L200 310 Z" stroke="url(#glowLine)" stroke-width="3" fill="none" />
  <line x1="260" y1="120" x2="390" y2="300" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="140" y1="210" x2="440" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />

  <!-- Órbitas ecológicas -->
  <ellipse cx="300" cy="210" rx="170" ry="90" stroke="#10b981" stroke-width="1.5" opacity="0.4" stroke-dasharray="10 5" transform="rotate(-12 300 210)" />
  <ellipse cx="300" cy="210" rx="130" ry="70" stroke="#06b6d4" stroke-width="1.5" opacity="0.4" stroke-dasharray="8 6" transform="rotate(20 300 210)" />

  <!-- Nodo Central (Matriz Energética Sostenible) -->
  <circle cx="300" cy="210" r="34" fill="#062e24" stroke="#10b981" stroke-width="3" />
  <circle cx="300" cy="210" r="14" fill="#34d399" />

  <!-- Nodos Periféricos -->
  <circle cx="140" cy="210" r="15" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <circle cx="260" cy="120" r="16" fill="#d97706" stroke="#fbbf24" stroke-width="2" />
  <circle cx="440" cy="160" r="15" fill="#059669" stroke="#34d399" stroke-width="2" />
  <circle cx="390" cy="300" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <circle cx="200" cy="310" r="14" fill="#10b981" stroke="#6ee7b7" stroke-width="2" />

  <!-- Tarjetas Flotantes de Áreas -->
  <rect x="205" y="80" width="115" height="26" rx="6" fill="#062e24" stroke="#fbbf24" stroke-width="1" />
  <text x="262" y="97" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Energía Solar</text>

  <rect x="380" y="120" width="125" height="26" rx="6" fill="#062e24" stroke="#34d399" stroke-width="1" />
  <text x="442" y="137" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Hidrógeno Verde</text>

  <rect x="75" y="235" width="135" height="26" rx="6" fill="#062e24" stroke="#38bdf8" stroke-width="1" />
  <text x="142" y="252" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Redes Inteligentes</text>

  <rect x="320" y="325" width="140" height="26" rx="6" fill="#062e24" stroke="#10b981" stroke-width="1" />
  <text x="390" y="342" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Economía Circular</text>
</svg>
